<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Official xAI Shop</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/pages/shop-x.css" />
    <link rel="stylesheet" href="../css/components/product.css" />
    <link rel="icon" href="../xAI-shop.ico" />
  </head>
  <body>
    <!-- HEADER -->
    <!-- Owner:  -->
    <!-- Branch:  -->
    <header class="shop-header"></header>
    <!-- FINE HEADER -->

    <!-- MAIN CONTENT -->
    <main class="shop">
      <!-- COLLECTION CARDS -->
      <!-- Owner: Ashawani Singh -->
      <!-- Branch: feature/card-collections -->
      <section class="collections"></section>
      <!-- FINE COLLECTION CARDS -->

      <!-- PRODUCTS CARDS -->
      <!-- Owner: Nicolau Alfredo -->
      <!-- Branch: feature/shop-x-products-grid -->
      <section class="products" aria-labelledby="products-title">
        <div class="products__container">
          <div class="products__header">
            <h2 id="products-title" class="products__title">All Products</h2>
          </div>

          <div class="products__grid" data-products-grid></div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <!-- Owner: -->
    <!-- Branch:  -->
    <footer class="shopt-footer"></footer>
    <!-- FINE FOOTER -->

    <!-- JS  -->
    <script type="module" src="../js/features/cart/cartAddProduct.js"></script>
    <script type="module" src="../js/features/cart/cartPage.js"></script>
    <script type="module" src="../js/features/shop-x/productPage.js"></script>
  </body>
</html>
