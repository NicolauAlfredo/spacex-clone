<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Official xAI Shop</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/pages/shop-x.css" />
    <link rel="icon" href="../xAI-shop.ico" />
  </head>
  <body>
    <!-- HEADER -->
    <!-- Owner:  -->
    <!-- Branch:  -->
    <header class="shop-header">
      <div class="shop-header__container">
        <a href="#" class="shop-header__logo">
          <img
            src="../assets/pages/shopx/logo/xai-header-logo.webp"
            alt="Shop xAI"
          />
        </a>

        <nav class="shop-header__menu">
          <ul class="menu__items">
            <li class="menu__item hidden">
              <button class="menu__item-lang" type="button">
                <img
                  src="../assets/pages/shopx/languages/italiano.jfif"
                  alt="Italiano"
                  class="currency-flag"
                />
                <span class="currency-money">EUR €</span>
                <svg
                  aria-hidden="true"
                  focusable="false"
                  fill="none"
                  width="10"
                  class="menu__item-chevron-down"
                  viewBox="0 0 10 10"
                >
                  <path
                    d="m1 3 4 4 4-4"
                    stroke="currentColor"
                    stroke-linecap="square"
                  ></path>
                </svg>
              </button>

              <ul class="curency-country">
                <li class="currency-country__item">
                  <button type="button">
                    <img
                      src="../assets/pages/shopx/languages/australia.jfif"
                      alt="Australia"
                    />
                    <span>Australia (AUD $)</span>
                  </button>
                </li>

                <li class="currency-country__item">
                  <button type="button">
                    <img
                      src="../assets/pages/shopx/languages/australia.jfif"
                      alt="Australia"
                    />
                    <span>Australia (AUD $)</span>
                  </button>
                </li>

                <li class="currency-country__item">
                  <button type="button">
                    <img
                      src="../assets/pages/shopx/languages/australia.jfif"
                      alt="Australia"
                    />
                    <span>Australia (AUD $)</span>
                  </button>
                </li>
              </ul>
            </li>

            <li class="menu__item hidden">
              <a href="#">
                <span class="menu__item-login">login</span>

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    d="M16.125 8.75c-.184 2.478-2.063 4.5-4.125 4.5s-3.944-2.021-4.125-4.5c-.187-2.578 1.64-4.5 4.125-4.5 2.484 0 4.313 1.969 4.125 4.5Z"
                    stroke="currentColor"
                    stroke-width="1"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M3.017 20.747C3.783 16.5 7.922 14.25 12 14.25s8.217 2.25 8.984 6.497"
                    stroke="currentColor"
                    stroke-width="1"
                    stroke-miterlimit="10"
                  />
                </svg>
              </a>
            </li>

            <li class="menu__item">
              <a href="#">
                <span class="menu__item-search">Search</span>

                <span>
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                  >
                    <path
                      d="M10.364 3a7.364 7.364 0 1 0 0 14.727 7.364 7.364 0 0 0 0-14.727Z"
                      stroke="currentColor"
                      stroke-width="1"
                      stroke-miterlimit="10"
                    />
                    <path
                      d="M15.857 15.858 21 21.001"
                      stroke="currentColor"
                      stroke-width="1"
                      stroke-miterlimit="10"
                      stroke-linecap="round"
                    />
                  </svg>
                </span>
              </a>
            </li>

            <li class="menu__item">
              <a href="#">
                <span class="menu__item-cart">Cart (0)</span>

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    d="M21.5 21.5v-15h-19v15h19ZM8 6V5a4 4 0 1 1 8 0v1"
                    stroke="currentColor"
                    stroke-width="1"
                  />
                </svg>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <!-- FINE HEADER -->

    <!-- MAIN CONTENT -->
    <main class="shop">
      <!-- COLLECTION CARDS -->
      <!-- Owner: Ashawani Singh -->
      <!-- Branch: feature/card-collections -->
      <section class="collections">
        <div class="collections__container">
          <a href="#" class="collection">
            <div class="collection__img">
              <img
                src="../assets/pages/shopx/x-collection/images/x-model-v4.webp"
                alt="X Collection"
              />
            </div>

            <div class="collection__content">
              <h3 class="content__title">[ X Collection ]</h3>
              <button type="button" class="content__button">Shop All</button>
            </div>
          </a>

          <a href="#" class="collection">
            <div class="collection__img">
              <img
                src="../assets/pages/shopx/xai-collection/images/xai-model.webp"
                alt="xAI Collection"
              />
            </div>

            <div class="collection__content">
              <h3 class="content__title">[ xAI Collection ]</h3>
              <button type="button" class="content__button">Shop All</button>
            </div>
          </a>
        </div>
      </section>
      <!-- FINE COLLECTION CARDS -->
    </main>

    <!-- FOOTER -->
    <!-- Owner: -->
    <!-- Branch:  -->
    <footer class="shopt-footer"></footer>
    <!-- FINE FOOTER -->

    <!-- JS  -->
    <script type="module" src="../js/features/cart/cartAddProduct.js"></script>
    <script type="module" src="../js/features/cart/cartPage.js"></script>
  </body>
</html>
