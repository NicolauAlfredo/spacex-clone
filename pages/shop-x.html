<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Official xAI Shop</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/pages/shop-x.css" />
    <link rel="icon" href="../xAI-shop.ico" />
  </head>
  <body>
    <!-- HEADER -->
    <!-- Owner:  -->
    <!-- Branch:  -->
    <header class="shop-header"></header>
    <!-- FINE HEADER -->

    <!-- MAIN CONTENT -->
    <main class="shop">
      <!-- COLLECTION CARDS -->
      <!-- Owner: Ashawani Singh -->
      <!-- Branch: feature/card-collections -->
      <section class="collections"></section>
      <!-- FINE COLLECTION CARDS -->

      <!-- PRODUCTS CARDS -->
      <!-- Owner: Nicolau Alfredo -->
      <!-- Branch: feature/shop-x-products-grid -->
      <section class="products">
        <div class="products__container">
          <div class="products__header">
            <h2 class="products__title">All Products</h2>
          </div>

          <div class="products__grid">
            <article class="products__card">
              <a href="#" class="products__image-link">
                <img
                  src="../assets/pages/shopx/xai-collection/products/xai-multi-tumbler-black.webp"
                  alt="xAI Multi Tumbler"
                  class="products__image products__image--primary"
                />
              </a>

              <div class="products__card-info">
                <div class="products__card-content">
                  <h3 class="products__product-title">
                    <a href="#" class="products__product-link">
                      xAI Multi Tumbler
                    </a>
                  </h3>

                  <span class="products__price">€45,95</span>
                </div>
              </div>
            </article>
          </div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <!-- Owner: -->
    <!-- Branch:  -->
    <footer class="shopt-footer"></footer>
    <!-- FINE FOOTER -->

    <!-- JS  -->
    <script type="module" src="../js/features/cart/cartAddProduct.js"></script>
    <script type="module" src="../js/features/cart/cartPage.js"></script>
  </body>
</html>
