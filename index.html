<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpaceX</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/pages/home.css" />
    <link rel="stylesheet" href="./css/layout/header.css" />
    <link rel="stylesheet" href="./css/layout/footer.css" />
    <link rel="stylesheet" href="./css/components/button.css" />
    <link rel="icon" href="./favicon-spacex.ico" />
  </head>
  <body>
    <!-- HEADER -->
    <!-- Owner: Nicolau -->
    <!-- Branch: feature/home-header -->

    <header class="header"></header>
    <!-- FINE HEADER -->

    <!-- MAIN CONTENT -->
    <main class="home">
      <!-- SECTION 01 -->
      <!-- Starship's Twelfth Flight Test -->
      <!-- Owner: Felice -->
      <!-- Branch: feature/home-starship -->
      <section class="hero-section hero-section--starship">
        <video class="hero-section__video" autoplay muted loop playsinline>
          <!-- MOBILE FIRST -->
          <source
            src="./assets/pages/home/videos/Starships-twelfth-flight-test-mobile.mp4"
            media="(max-width: 767px)"
          />
          <!-- DESKTOP -->
          <source
            src="./assets/pages/home/videos/Starships-twelfth-flight-test.mp4"
            media="(min-width: 768px)"
          />
        </video>

        <div class="hero-section__content">
          <span class="hero-section__date">MAY 22, 2026</span>

          <h2 class="hero-section__title">STARSHIP'S TWELFTH FLIGHT TEST</h2>

          <p class="hero-section__description"></p>

          <!-- Button -->
          <a class="spx-button" href="#">
            <span class="spx-button__text">Reserve Your Ride</span>

            <span class="spx-button__arrow">
              <svg width="13" height="12" viewBox="0 0 13 12" fill="none">
                <path
                  d="M11.9893 5.58371L12.2471 5.89914L11.9893 6.21555L8.10059 10.9782L7.3252 10.3454L10.5479 6.39914L1.39941 6.39914L1.39941 5.39914L10.5479 5.39914L7.3252 1.45383L8.10059 0.821014L11.9893 5.58371Z"
                />
              </svg>
            </span>
          </a>
          <!-- Button -->
        </div>
      </section>
      <!-- FINE SECTION 01 -->

      <!-- SECTION 02 -->
      <!-- Making Life Multiplanetary -->
      <!-- Owner: Felice -->
      <!-- Branch: feature/home-making-life -->
      <section class="hero-section hero-section--multiplanetary"></section>
      <!-- FINE SECTION 02 -->

      <!-- SECTION 03 -->
      <!-- Revolutionizing Space Technology -->
      <!-- Owner: Federico -->
      <!-- Branch: feature/home-space -->
      <section class="hero-section hero-section--technology"></section>
      <!-- FINE SECTION 03 -->

      <!-- SECTION 04 -->
      <!-- World's Leading Launch Service Provider -->
      <!-- Owner: Federico -->
      <!-- Branch: feature/home-launch -->
      <section class="hero-section hero-section--launch-provider"></section>
      <!-- FINE SECTION 04 -->

      <!-- SECTION 05 -->
      <!-- Advancing Human Spaceflight -->
      <!-- Owner: Fidel -->
      <!-- Branch: feature/home-advancing -->
      <section class="hero-section hero-section--spaceflight"></section>
      <!-- FINE SECTION 05 -->

      <!-- SECTION 06 -->
      <!-- Delivering High-Speed Internet From Space -->
      <!-- Owner: Rosario -->
      <!-- Branch: feature/home-starlink-section -->
      <section class="hero-section hero-section--starlink"></section>
      <!-- FINE SECTION 06 -->
    </main>
    <!-- FINE MAIN CONTENT -->

    <!-- FOOTER -->
    <!-- Owner: Rosario -->
    <!-- Branch: feature/home-footer -->
    <footer class="footer"></footer>
    <!-- FINE FOOTER -->

    <!-- GLOBAL JS  -->
    <script type="module" src="./js/features/dropdownMenu.js" defer></script>
    <script
      type="module"
      src="./js/features/upcomingLaunches.js"
      defer
    ></script>
  </body>
</html>
