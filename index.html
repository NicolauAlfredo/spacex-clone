<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpaceX</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/pages/home.css" />
    <link rel="stylesheet" href="./css/layout/header.css" />
    <link rel="stylesheet" href="./css/layout/footer.css" />
    <link rel="stylesheet" href="./css/components/button.css" />
    <link rel="icon" href="./favicon-spacex.ico" />
  </head>
  <body>
    <!-- HEADER -->
    <!-- Owner: Nicolau -->
    <!-- Branch: feature/home-header -->

    <header class="header"></header>
    <!-- FINE HEADER -->

    <!-- MAIN CONTENT -->
    <main class="home">
      <!-- SECTION 01 -->
      <!-- Starship's Twelfth Flight Test -->
      <!-- Owner: Felice -->
      <!-- Branch: feature/home-starship -->
      <section class="hero-section hero-section--starship"></section>
      <!-- FINE SECTION 01 -->

      <!-- SECTION 02 -->
      <!-- Making Life Multiplanetary -->
      <!-- Owner: Felice -->
      <!-- Branch: feature/home-making-life -->
      <section class="hero-section hero-section--multiplanetary"></section>
      <!-- FINE SECTION 02 -->

      <!-- SECTION 03 -->
      <!-- Revolutionizing Space Technology -->
      <!-- Owner: Federico -->
      <!-- Branch: feature/home-space -->
      <section class="hero-section hero-section--technology"></section>
      <!-- FINE SECTION 03 -->

      <!-- SECTION 04 -->
      <!-- World's Leading Launch Service Provider -->
      <!-- Owner: Federico -->
      <!-- Branch: feature/home-launch -->
      <section class="hero-section hero-section--launch-provider">
        <div class="hero-section--launch-provider--container">
          <span class="hero-section--gradient"></span>
          <span class="hero-section--launch-provider--video">
            <video
              src="/assets/pages/home/videos/leading-launch-service-mobile.mp4"
            ></video>
          </span>
          <!-- Container per il testo -->
          <div class="hero-section--launch-provider--inner-text">
            <h2>WORLD'S LEADING LAUNCH SERVICE PROVIDER</h2>
            <p>
              SpaceX leads the world in launches with its reliable, reusable
              rockets and is developing the fully and rapidly reusable rockets
              necessary to transform humanity’s ability to access space into
              something as routine as air travel.
            </p>
          </div>
        </div>
      </section>
      <!-- FINE SECTION 04 -->

      <!-- SECTION 05 -->
      <!-- Advancing Human Spaceflight -->
      <!-- Owner: Fidel -->
      <!-- Branch: feature/home-advancing -->
      <section class="hero-section hero-section--spaceflight"></section>
      <!-- FINE SECTION 05 -->

      <!-- SECTION 06 -->
      <!-- Delivering High-Speed Internet From Space -->
      <!-- Owner: Rosario -->
      <!-- Branch: feature/home-starlink-section -->
      <section class="hero-section hero-section--starlink"></section>
      <!-- FINE SECTION 06 -->
    </main>
    <!-- FINE MAIN CONTENT -->

    <!-- FOOTER -->
    <!-- Owner: Rosario -->
    <!-- Branch: feature/home-footer -->
    <footer class="footer"></footer>
    <!-- FINE FOOTER -->

    <!-- GLOBAL JS  -->
    <script type="module" src="./js/features/dropdownMenu.js" defer></script>
    <script
      type="module"
      src="./js/features/upcomingLaunches.js"
      defer
    ></script>
  </body>
