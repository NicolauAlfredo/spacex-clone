      <!-- COLLECTION CARDS -->
      <!-- Owner: Ashawani Singh -->
      <!-- Branch: feature/card-collections -->
      <section class="collections">
        <div class="collections__container">
          <a href="#" class="collection">
            <div class="collection__img">
              <img
                src="../assets/pages/shopx/x-collection/images/x-model-v4.webp"
                alt="X Collection"
              />
            </div>

            <div class="collection__content">
              <h3 class="content__title">[ X Collection ]</h3>
              <button type="button" class="content__button">Shop All</button>
            </div>
          </a>

          <a href="#" class="collection">
            <div class="collection__img">

                src="../assets/pages/shopx/xai-collection/images/xai-model.webp"
                alt="xAI Collection"
              />
            </div>

            <div class="collection__content">
              <h3 class="content__title">[ xAI Collection ]</h3>
              <button type="button" class="content__button">Shop All</button>
            </div>
          </a>
        </div>
      </section>
      <!-- FINE COLLECTION CARDS -->

      <!-- PRODUCTS CARDS -->
      <!-- Owner: Nicolau Alfredo -->
      <!-- Branch: feature/shop-x-products-grid -->
      <section class="products" aria-labelledby="products-title">
        <div class="products__container">
          <div class="products__header">
            <h2 id="products-title" class="products__title">All Products</h2>
          </div>

          <div class="products__grid" data-products-grid></div>
        </div>
      </section>

    <div class="currency-modal" data-currency-modal aria-hidden="true">
      <div class="currency-modal__overlay" data-currency-close></div>

      <div
        class="currency-modal__content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="currency-modal-title"
      >
        <div class="currency-modal__header">
          <h2 id="currency-modal-title">Select your region</h2>

          <button
            class="currency-modal__close"
            type="button"
            aria-label="Close currency selector"
            data-currency-close
          >
            ×
          </button>
        </div>

        <ul class="currency-modal__list">
          <li class="currency-modal__item">
            <button
              type="button"
              data-currency-option
              data-currency-text="Australia (AUD $)"
              data-currency-short="AUD $"
              data-currency-flag="../assets/pages/shopx/languages/australia.jfif"
            >
              <img
                src="../assets/pages/shopx/languages/australia.jfif"
                alt="Australia"
              />
              <span>Australia (AUD $)</span>
            </button>
          </li>

          <li class="currency-modal__item">
            <button
              type="button"
              data-currency-option
              data-currency-text="Italy (EUR €)"
              data-currency-short="EUR €"
